<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>演習：クラスによるグループ分け</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>NEWS</h1>
        <p>お知らせ</p>

        <div class="container">
            <div class="news">
                <p class="category service">サービス</p>
                <p class="date">2026.11.01</p>
                <h2>新サービスのお知らせ</h2>
                <p>新サービス提供を開始しました。</p>
            </div>

            <div class="news">
                <p class="category important">重要</p>
                <p class="date">2026.10.20</p>
                <h2>営業時間変更のお知らせ</h2>
                <p>営業時間を変更いたしました。</p>
            </div>

            <div class="news">
                <p class="category event">イベント</p>
                <p class="date">2026.10.10</p>
                <h2>メンテナンスのお知らせ</h2>
                <p>システムメンテナンスを実施します。</p>
            </div>
        </div>
        
    </main>
    
</body>
</html>
